org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Appens standardværdier ved første start. Alt kan ændres under Indstillinger i appen.
# Tom webhook = ingen upload. Læg aldrig en rigtig webhook-adresse her: filen ligger i repoet og bygges ind i APK'en.
mink.bandLoMhz=869.380
mink.bandHiMhz=869.750
mink.signalKhz=6
# Fast målfrekvens i MHz. Tom = intet mål på forhånd; målet vælges ved at trykke på signalet i vandfaldet.
mink.targetMhz=
mink.ppm=0
mink.webhook=

# Projektets repo på GitHub ("ejer/navn"). Herfra henter appen opdateringer, og herhen peger "Kildekode" under Om MINK.
# Tom = appen ser aldrig efter opdateringer.
mink.repo=Intraon/MINK

# Brugerens egen LoRa-kanal (MeshCore EU/UK narrow som standard). Vises som et markeret felt i vandfaldet,
# så man kan se, hvad der ligger inde i kanalen. Båndet ovenfor er bredere, så støj uden for kanalen også ses.
mink.channelMhz=869.618
mink.channelKhz=62.5

# Kilden til baggrundskortet i den kortfil, appen kan lægge ved, når en tur deles: adressen på en TileJSON-oversigt
# over vektorfliser i OpenMapTiles' inddeling. Appen henter kun fliser for de områder, turen går igennem, og kun når
# brugeren beder om kortfilen. Tom = kortfilen laves uden baggrund.
mink.mapTiles=https://tiles.openfreemap.org/planet
