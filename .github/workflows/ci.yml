# Bygger appen og kører unittestene for hver pull request og hvert push til main.
# Der signeres med Androids debug-nøgle; resultatet udgives ikke.
#
# Ændringer, der kun rører dokumentation, springes over: de kan ikke ændre bygget.
# Bliver dette tjek et krav for at merge, skal filteret flyttes ind i jobbet. Ellers venter en ren
# dokumentationsændring på et tjek, der aldrig kører.
name: Byg og test

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/ISSUE_TEMPLATE/**']

permissions:
  contents: read

jobs:
  byg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Byg og test
        run: sh tools/build.sh

      - name: Testrapport ved fejl
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: testrapport
          path: app/build/reports/tests/
