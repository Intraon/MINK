# Bygger appen og kører unittestene for hver pull request og hvert push til main.
# Der signeres med Androids debug-nøgle; resultatet udgives ikke.
name: Byg og test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  byg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Byg og test
        run: sh tools/build.sh

      - name: Testrapport ved fejl
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testrapport
          path: app/build/reports/tests/
